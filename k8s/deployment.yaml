kind: Deployment
apiVersion: apps/v1
metadata:
  name: application-pipeline-devops-warning
  namespace: pipeline-devops-warning
  labels:
    app: application-pipeline-devops-warning
    app.kubernetes.io/instance: bb-gitops-pipeline-devops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: application-pipeline-devops-warning
      app.kubernetes.io/instance: bb-gitops-pipeline-devops
  template:
    metadata:
      labels:
        app: application-pipeline-devops-warning
        app.kubernetes.io/instance: bb-gitops-pipeline-devops
    spec:
      containers:
        - name: application-pipeline-devops-warning
          image: default-route-openshift-image-registry.apps.itz-vaz6gq.infra01-lb.dal14.techzone.ibm.com/pipeline-devops-warning/image-pipeline-devops-warning-route:v1
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: RUN_TYPE
              value: cpu
            - name: CPU_PERCENT
              value: '95'
          resources:
            limits:
              cpu: 50m
              memory: 20Gi
            requests:
              cpu: 10m
              memory: 10Gi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: Always
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      imagePullSecrets:
        - name: deployer-dockercfg-6lc8v
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600